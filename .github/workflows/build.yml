name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: arma-actions/hemtt@v1
        name: Setup HEMTT

      - name: Check tag matches mod version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(hemtt value project.version)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in addons/main/script_mod.hpp"
            exit 1
          fi

      - name: Check
        run: hemtt check

      - name: Release build
        run: hemtt release

      - name: Upload mod folder
        uses: actions/upload-artifact@v4
        with:
          name: '@swiftsfx'
          path: .hemttout/release/

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: releases/*.zip
          generate_release_notes: true
